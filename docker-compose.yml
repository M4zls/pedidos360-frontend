# ─────────────────────────────────────────────────────────────
#  Pedidos360 — front (nginx: SPA)
#
#  Requiere que el stack de backend (repo pedidos360-backend,
#  docker-compose.yml de esa carpeta) este levantado primero: nginx
#  reenvia /api/* directo a cada servicio, sin gateway intermedio.
#
#  Uso:
#    docker compose up --build     # front en http://localhost:8081
#    docker compose down
# ─────────────────────────────────────────────────────────────

services:
  front:
    build: .
    environment:
      # La imagen arranca en modo "ingress" (Kubernetes: nginx solo sirve el
      # SPA). Con compose, nginx reenvia /api/* directo a cada servicio del
      # backend. host.docker.internal apunta al host, donde el backend
      # publica sus puertos.
      ROUTING_MODE: gateway
      AUTH_SERVICE_URL: http://host.docker.internal:8080
      INVENTORY_SERVICE_URL: http://host.docker.internal:8083
      ORDERS_SERVICE_URL: http://host.docker.internal:8082
      RABBITMQ_ADMIN_URL: http://host.docker.internal:8084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    restart: unless-stopped
