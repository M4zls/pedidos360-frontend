# ─────────────────────────────────────────────────────────────
#  API Gateway de Pedidos360  (nginx como reverse proxy, NO un servicio aparte)
#
#  Config de referencia para producción: un nginx que sirve el SPA (dist/) y
#  enruta /api/* por prefijo al servicio que corresponda. Para desarrollo NO
#  se usa esto: alcanza con `npm start` + proxy.conf.json.
#
#  Deploy: `npm run build`, copiar dist/pedidos360-front/browser a la raíz de
#  nginx, y ajustar las URLs de abajo si los servicios corren en otro host.
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /var/www/pedidos360;      # <- acá va el contenido de dist/.../browser
  index index.html;

  # --- Auth: login + /api/me + roles (backend/auth-service, :8080) ---
  location /api/auth/ {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/pedidos360-proxy.inc;
  }
  location = /api/me {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/pedidos360-proxy.inc;
  }
  location /api/admin/ {
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/pedidos360-proxy.inc;
  }

  # --- Inventario (backend/inventory-service, :8083) ---
  location /api/inventory/ {
    proxy_pass http://127.0.0.1:8083;
    include /etc/nginx/pedidos360-proxy.inc;
  }

  # --- Pedidos (backend/orders-service, :8081) ---
  location /api/orders/ {
    proxy_pass http://127.0.0.1:8081;
    include /etc/nginx/pedidos360-proxy.inc;
  }

  # Cualquier otra /api/* -> 404 del gateway
  location /api/ { return 404; }

  # --- SPA: rutas del router de Angular -> index.html ---
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Guardar como /etc/nginx/pedidos360-proxy.inc :
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
