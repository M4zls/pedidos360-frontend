<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-label="Notificaciones"
    class="relative flex h-9 w-9 items-center justify-center rounded-full text-white transition hover:bg-white/10
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/70"
  >
    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path d="M10 2a6 6 0 0 0-6 6v2.586l-1.707 1.707A1 1 0 0 0 3 14h14a1 1 0 0 0 .707-1.707L16 10.586V8a6 6 0 0 0-6-6Z" />
      <path d="M8.5 16a1.5 1.5 0 0 0 3 0h-3Z" />
    </svg>
    @if (notifications.unreadCount() > 0) {
      <span
        class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-orange-500 px-1 text-[10px] font-bold text-white"
      >
        {{ notifications.unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div
      role="dialog"
      aria-label="Notificaciones"
      class="card absolute right-0 z-40 mt-2 w-80 overflow-hidden border-white/10 bg-[var(--color-surface-2)] p-0"
    >
      <div class="border-b border-white/5 px-4 py-3">
        <p class="font-semibold text-white">Notificaciones</p>
      </div>

      <div class="max-h-80 overflow-y-auto">
        @for (n of notifications.items(); track n.id) {
          <button
            type="button"
            (click)="markRead(n.id)"
            class="block w-full border-b border-white/5 px-4 py-3 text-left text-sm transition last:border-0
                   hover:bg-white/5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/70"
            [class.opacity-50]="n.read"
          >
            <span class="flex items-start gap-2">
              @if (!n.read) {
                <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-orange-500" aria-hidden="true"></span>
              }
              <span>
                <span class="block text-neutral-200">{{ n.message }}</span>
                <span class="mt-0.5 block text-xs text-neutral-500">{{ n.createdAt | date: 'short' }}</span>
              </span>
            </span>
          </button>
        } @empty {
          <p class="px-4 py-6 text-center text-sm text-neutral-500">No hay notificaciones.</p>
        }
      </div>
    </div>
  }
</div>
