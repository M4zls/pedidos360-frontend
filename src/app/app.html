@if (isAuthenticated) {
  <div class="min-h-screen">
    <header class="sticky top-0 z-30 border-b border-white/10 bg-[var(--color-ink)]/85 backdrop-blur-xl">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3">
        <a routerLink="/home" class="flex items-center gap-2 no-underline">
          <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 font-display text-lg font-extrabold text-white shadow-lg shadow-orange-950/40">P</span>
          <span class="font-display text-xl font-extrabold tracking-tight text-white">
            Pedidos<span class="text-orange-500">360</span>
          </span>
        </a>

        <nav class="flex items-center gap-1">
          <a routerLink="/home" routerLinkActive="nav-link-active" class="nav-link">Carta</a>
          <a routerLink="/orders" routerLinkActive="nav-link-active" class="nav-link">
            {{ auth.isStaff() ? 'Pedidos' : 'Mis pedidos' }}
          </a>
          @if (auth.isStaff()) {
            <a routerLink="/inventory" routerLinkActive="nav-link-active" class="nav-link">Inventario</a>
          }
          @if (auth.isAdmin()) {
            <a routerLink="/admin/users" routerLinkActive="nav-link-active" class="nav-link">Usuarios</a>
          }

          @if (auth.canSwitchRoles()) {
            <select
              class="ml-2 rounded-lg border border-white/15 bg-white/5 px-2 py-1.5 text-xs font-medium text-white outline-none"
              [ngModel]="auth.role()" (ngModelChange)="actAs($event)"
            >
              @for (r of auth.roles(); track r) {
                <option class="bg-neutral-900" [ngValue]="r">Ver como {{ r }}</option>
              }
            </select>
          }

          <span class="mx-1 h-6 w-px bg-white/10"></span>
          <app-user-menu (logout)="logout()" (refresh)="refreshPermissions()" />
        </nav>
      </div>
    </header>

    <main>
      <router-outlet />
    </main>

    <footer class="mx-auto max-w-6xl px-5 py-10 text-center text-xs text-neutral-600">
      Pedidos360 — demo académica
    </footer>
  </div>
} @else {
  <router-outlet />
}
