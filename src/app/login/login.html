<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-neutral-950 px-4 py-10">
  <!-- Fondo: gradiente naranja -> negro + halos difusos -->
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-orange-500 via-orange-800 to-neutral-950"></div>
  <div class="pointer-events-none absolute -left-24 -top-24 h-96 w-96 rounded-full bg-orange-500/40 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-16 h-[28rem] w-[28rem] rounded-full bg-amber-400/20 blur-3xl"></div>

  <!-- Card -->
  <div class="relative w-full max-w-md rounded-3xl border border-white/15 bg-white/10 p-8 shadow-2xl backdrop-blur-2xl">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 shadow-lg shadow-orange-900/40">
        <span class="text-2xl font-black text-white">P</span>
      </div>
      <h1 class="text-2xl font-bold text-white">
        Pedidos<span class="text-orange-400">360</span>
      </h1>
      <p class="mt-1 text-sm text-white/60">Ingresá para gestionar los pedidos</p>
    </div>

    <button
      type="button"
      (click)="loginMicrosoft()"
      class="flex w-full items-center justify-center gap-3 rounded-xl border border-white/20 bg-white/95 px-4 py-3 font-medium text-neutral-800 transition hover:bg-white"
    >
      <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
      </svg>
      Continuar con Microsoft
    </button>

    <div class="my-6 flex items-center gap-3 text-xs uppercase tracking-wide text-white/40">
      <span class="h-px flex-1 bg-white/15"></span>
      o con usuario
      <span class="h-px flex-1 bg-white/15"></span>
    </div>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label for="username" class="mb-1.5 block text-sm font-medium text-white/80">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          placeholder="demo"
          class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-white placeholder-white/30 outline-none transition focus:border-orange-400/60 focus:bg-white/10"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-white/80">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          placeholder="demo123"
          class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-white placeholder-white/30 outline-none transition focus:border-orange-400/60 focus:bg-white/10"
        />
      </div>

      @if (error) {
        <p class="rounded-xl border border-red-400/30 bg-red-500/15 px-4 py-2.5 text-sm text-red-100">{{ error }}</p>
      }

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 px-4 py-2.5 font-semibold text-white shadow-lg shadow-orange-900/30 transition hover:from-orange-400 hover:to-orange-500 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-white/40">
      Demo: <span class="text-white/60">demo</span> / <span class="text-white/60">demo123</span>
    </p>
  </div>
</div>
