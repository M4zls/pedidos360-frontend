# ─────────────────────────────────────────────────────────────
#  front — SPA de Angular servido por nginx.
#  Es stateless (no tiene PVC): admite RollingUpdate y varias replicas,
#  a diferencia de los tres servicios del backend que escriben SQLite.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: pedidos360
  labels:
    app.kubernetes.io/name: front
    app.kubernetes.io/part-of: pedidos360
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front
        app.kubernetes.io/part-of: pedidos360
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: front
          image: __IMAGE_FRONT__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # En el cluster el Ingress rutea /api/*, asi que nginx solo
            # sirve el SPA. Ver docker-entrypoint.d/15-pedidos360-routing.sh.
            - name: ROUTING_MODE
              value: ingress
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: pedidos360
spec:
  selector:
    app.kubernetes.io/name: front
  ports:
    - name: http
      port: 80
      targetPort: http
