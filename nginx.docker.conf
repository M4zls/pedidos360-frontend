# ─────────────────────────────────────────────────────────────
#  Pedidos360 — nginx del contenedor del front.
#  Sirve el SPA (dist/.../browser) y reenvia /api/* al Gateway de
#  WSO2 API Manager (servicio "apim" de docker-compose), que es quien
#  valida el JWT y rutea a cada microservicio. Ver apim/README.md.
# ─────────────────────────────────────────────────────────────

upstream apim_gateway { server apim:8280; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://apim_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
