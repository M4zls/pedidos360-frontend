# ─────────────────────────────────────────────────────────────
#  Pedidos360 — nginx del front cuando corre en Kubernetes.
#
#  Aca nginx NO enruta /api/*: de eso se encarga el Ingress (Traefik),
#  que manda /api/auth, /api/admin, /api/me, /api/inventory y /api/orders
#  a los Services del backend antes de que la request llegue a este pod.
#  Por eso este archivo no tiene variables: no pasa por envsubst.
#
#  El bloque /api/ de abajo solo existe como red de seguridad: si alguna
#  vez llega una request de API hasta aca, es que falta una regla en el
#  Ingress del backend, y un 404 limpio lo hace evidente (en vez de
#  devolver el index.html y que el front falle parseando HTML como JSON).
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Endpoint para las probes de Kubernetes (el SPA no tiene backend propio).
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    return 404;
  }

  # SPA: las rutas del router de Angular se resuelven contra index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
