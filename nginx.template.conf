# ─────────────────────────────────────────────────────────────
#  Pedidos360 — nginx del front en EC2.
#  Sirve el SPA y reenvía /api/* a AWS API Gateway.
#  ${API_GATEWAY_URL} la inyecta el entrypoint de la imagen nginx
#  oficial (envsubst sobre /etc/nginx/templates/*.template) al
#  arrancar el contenedor.
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API Gateway de AWS: enruta al EC2 backend (auth/inventory/orders).
  location /api/ {
    proxy_pass ${API_GATEWAY_URL};
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: rutas del router de Angular -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}