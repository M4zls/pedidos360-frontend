# ─────────────────────────────────────────────────────────────
#  Pedidos360 — nginx del front en EC2/compose.
#  Sirve el SPA y reenvía /api/* directo a cada microservicio del
#  backend (sin gateway intermedio): cada servicio valida su propio
#  JWT de Microsoft. Las URLs las inyecta el entrypoint de la imagen
#  nginx oficial (envsubst sobre /etc/nginx/templates/*.template) al
#  arrancar el contenedor.
#
#  Los location NO llevan "/" al final: con location /api/orders/ (y
#  proxy_pass con URI), un POST a /api/orders exacto (sin barra, como
#  hace orders.service.ts al crear un pedido) no matchea el location y
#  nginx responde 301 a ".../api/orders/" usando $host, que no lleva
#  puerto -> el browser lo sigue a http://localhost/... y lo bloquea
#  como cross-origin. Sin "/" en el location y con proxy_pass sin URI
#  (reenvia el request_uri tal cual, sin reescribirlo) no pasa.
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/me {
    proxy_pass ${AUTH_SERVICE_URL};
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/inventory {
    proxy_pass ${INVENTORY_SERVICE_URL};
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/orders {
    proxy_pass ${ORDERS_SERVICE_URL};
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/rabbitmq {
    proxy_pass ${RABBITMQ_ADMIN_URL};
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: rutas del router de Angular -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
