# ─────────────────────────────────────────────────────────────
#  Pedidos360 — nginx del front en EC2/compose.
#  Sirve el SPA y reenvía /api/* directo a cada microservicio del
#  backend (sin gateway intermedio): cada servicio valida su propio
#  JWT de Microsoft. Las URLs las inyecta el entrypoint de la imagen
#  nginx oficial (envsubst sobre /etc/nginx/templates/*.template) al
#  arrancar el contenedor.
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/me {
    proxy_pass ${AUTH_SERVICE_URL}/api/me;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/inventory/ {
    proxy_pass ${INVENTORY_SERVICE_URL}/api/inventory/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/orders/ {
    proxy_pass ${ORDERS_SERVICE_URL}/api/orders/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/rabbitmq/ {
    proxy_pass ${RABBITMQ_ADMIN_URL}/api/admin/rabbitmq/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: rutas del router de Angular -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
